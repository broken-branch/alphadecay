name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:17.6-bookworm
        env:
          POSTGRES_DB: alphadecay_test
          POSTGRES_USER: alphadecay
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphadecay -d alphadecay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHADECAY_TEST_POSTGRES_URL: postgresql+pg8000://alphadecay@127.0.0.1:5432/alphadecay_test
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify public links
        run: python3 ops/quality/public_link_check.py --root . README.md docs/public/*.md

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: false

      - name: Install Python dependencies
        run: uv sync --python 3.12 --frozen --all-groups

      - name: Verify Python and contracts
        run: |
          uv run --python 3.12 pytest -q
          uv run --python 3.12 pytest -q \
            ops/media/test_render_one_page.py \
            ops/deploy/test_scheduler_tick.py \
            ops/quality/test_scheduler_workflow_check.py
          uv run --python 3.12 ruff check \
            backend \
            ops/contracts \
            ops/deploy \
            ops/media \
            ops/quality/scheduler_workflow_check.py \
            ops/quality/test_scheduler_workflow_check.py \
            ops/release/generate_third_party_notices.py \
            ops/release/test_third_party_notices.py
          uv run --python 3.12 python -m ops.contracts.generate_openapi
          git diff --exit-code -- contracts/openapi-v1.json

      - name: Verify public copy
        run: |
          uv run --python 3.12 python ops/quality/public_copy_check.py
          uv run --python 3.12 python ops/quality/render_blueprint_check.py
          uv run --python 3.12 python ops/quality/scheduler_workflow_check.py

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Verify browser application
        run: |
          npm ci
          uv run --python 3.12 python -m ops.release.generate_third_party_notices --check
          npm test -- --run
          npm run typecheck
          npm run build

      - name: Build production image
        run: docker build --tag alphadecay:public-ci .
