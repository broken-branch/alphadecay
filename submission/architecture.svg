<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">How alphadecay reviews an options position</title>
  <desc id="description">Position and evidence move through bounded model tags and fixed decision rules before the Trading API can send and verify one complete spread order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1L11 6L1 11" fill="none" stroke="#A991FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#0D0D0D"/>
  <g font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
    <text x="96" y="112" fill="#A991FF" font-size="20" font-weight="600" letter-spacing="2.5">ONE POSITION, ONE DECISION RECORD</text>
    <text x="96" y="184" fill="#F6F6F6" font-size="54" font-weight="600">From opening thesis to broker result</text>
    <text x="98" y="232" fill="#C8C8C8" font-size="24">The model labels evidence. Fixed rules choose what happens next.</text>

    <g fill="#171717" stroke="#4D4D4D" stroke-width="2">
      <rect x="96" y="316" width="300" height="210" rx="18"/>
      <rect x="454" y="316" width="300" height="210" rx="18"/>
      <rect x="812" y="316" width="300" height="210" rx="18"/>
      <rect x="1170" y="316" width="334" height="210" rx="18"/>
    </g>
    <g fill="none" stroke="#A991FF" stroke-width="4" marker-end="url(#arrow)">
      <path d="M396 421H435"/>
      <path d="M754 421H793"/>
      <path d="M1112 421H1151"/>
    </g>
    <g fill="#A991FF" font-size="18" font-weight="700" letter-spacing="1.5">
      <text x="126" y="360">POSITION + THESIS</text>
      <text x="484" y="360">EVIDENCE</text>
      <text x="842" y="360">DECISION</text>
      <text x="1200" y="360">TRADING API</text>
    </g>
    <g fill="#F6F6F6" font-size="28" font-weight="600">
      <text x="126" y="414">What we meant</text>
      <text x="126" y="450">to own</text>
      <text x="484" y="414">What changed</text>
      <text x="842" y="414">Hold, close,</text>
      <text x="842" y="450">roll, or stop</text>
      <text x="1200" y="414">Send and verify</text>
      <text x="1200" y="450">one spread</text>
    </g>
    <g fill="#8E8E8E" font-size="19">
      <text x="126" y="495">Position and opening reason</text>
      <text x="484" y="495">Bounded model tags</text>
      <text x="842" y="495">Fixed application rules</text>
      <text x="1200" y="495">Exact account reconciliation</text>
    </g>

    <g transform="translate(96 612)">
      <rect width="1408" height="150" rx="16" fill="#171717" stroke="#4D4D4D" stroke-width="2"/>
      <text x="34" y="48" fill="#A991FF" font-size="18" font-weight="700" letter-spacing="1.8">DECISION RECORD</text>
      <text x="34" y="94" fill="#F6F6F6" font-size="26" font-weight="600">Opening reason · later evidence · rejected choices · selected action · broker state</text>
      <text x="34" y="126" fill="#8E8E8E" font-size="20">Every step stays tied to the same position.</text>
    </g>
  </g>
</svg>
