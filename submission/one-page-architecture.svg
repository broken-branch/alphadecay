<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Alpaca role receipt</title>
  <desc id="description">Three columns separate the Trading API competition record, MCP read-only research, and CLI paper endpoint check.</desc>
  <rect width="1600" height="720" rx="18" fill="#F6F6F6"/>
  <g font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="72" fill="#242326" font-size="34" font-weight="700">ALPACA ROLE RECEIPT</text>
    <text x="64" y="112" fill="#4F4D52" font-size="22">Each tool has one inspectable job. Evidence roles do not overlap.</text>
    <g fill="#FFFFFF" stroke="#B9B5AE" stroke-width="2">
      <rect x="64" y="158" width="458" height="492" rx="14"/>
      <rect x="571" y="158" width="458" height="492" rx="14"/>
      <rect x="1078" y="158" width="458" height="492" rx="14"/>
    </g>
    <g fill="#684FC6" font-size="22" font-weight="700" letter-spacing="1.4">
      <text x="96" y="208">TRADING API</text><text x="603" y="208">OFFICIAL MCP</text><text x="1110" y="208">ALPACA CLI</text>
    </g>
    <g fill="#242326" font-size="29" font-weight="650">
      <text x="96" y="262">Orders, fills,</text><text x="96" y="300">reconciliation</text>
      <text x="603" y="262">Read-only</text><text x="603" y="300">research</text>
      <text x="1110" y="262">Paper endpoint</text><text x="1110" y="300">check</text>
    </g>
    <g fill="#4F4D52" font-size="21">
      <text x="96" y="358">• Paper account and positions</text><text x="96" y="398">• Multi-leg order and fill</text><text x="96" y="438">• Whole-account certificate</text>
      <text x="603" y="358">• App selects each call</text><text x="603" y="398">• Model cannot direct tools</text><text x="603" y="438">• No order authority</text>
      <text x="1110" y="358">• Outside the web app</text><text x="1110" y="398">• No production subprocess</text><text x="1110" y="438">• No order in this receipt</text>
    </g>
    <g font-size="18" font-weight="700" letter-spacing="1.1">
      <rect x="96" y="548" width="394" height="58" rx="7" fill="#E7E0FF"/><text x="120" y="584" fill="#3E2F85">COMPETITION EVIDENCE</text>
      <rect x="603" y="548" width="394" height="58" rx="7" fill="#EEEEEE"/><text x="627" y="584" fill="#4F4D52">SUPPORTING RESEARCH</text>
      <rect x="1110" y="548" width="394" height="58" rx="7" fill="#EEEEEE"/><text x="1134" y="584" fill="#4F4D52">DEVELOPMENT CHECK</text>
    </g>
    <text x="64" y="690" fill="#4F4D52" font-size="19">Public Replay is separate sample evidence. It never represents a broker fill.</text>
  </g>
</svg>
