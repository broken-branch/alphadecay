[project]
name = "alphadecay"
version = "0.1.0"
description = "Paper-options lifecycle agent"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alpaca-py==0.44.0",
  "alpaca-mcp-server==2.3.0",
  "cryptography==50.0.1",
  "fastapi==0.116.1",
  "google-genai==2.20.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "pg8000==1.31.5",
  "requests==2.34.2",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
